production:
  # Big cities and anywhere recently viewed stay fresh hourly; the long tail
  # refreshes a few times a day. Both fetch in batched requests.
  refresh_hot_weather:
    class: RefreshWeatherTierJob
    args: [ "hot" ]
    schedule: every hour
  refresh_cold_weather:
    class: RefreshWeatherTierJob
    args: [ "cold" ]
    schedule: every 6 hours
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
