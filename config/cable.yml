# Solid Cable in development as well as production, for the same reason
# config/environments/development.rb runs Solid Queue rather than the async
# adapter: the jobs that broadcast run in their own process (`bin/jobs`, started
# by `bin/dev`), and the async adapter's pubsub never leaves the process it was
# published from — every broadcast a job made would be silently dropped. Backed
# by its own `cable` database, like production (config/database.yml).
development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 1.second
  message_retention: 1.day

# The test adapter records broadcasts instead of delivering them, which is what
# ActionCable::TestHelper's assertions read. It follows that a system test's
# browser receives nothing — see test/system/globe_test.rb, which dispatches the
# stream action itself rather than waiting on a delivery that can't arrive.
test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 1.second
  message_retention: 1.day
