<!doctype html>

<html lang="en">

  <head>

    <title>No connection</title>

    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#103a86">

    <!--
      Shown by the service worker when a page is wanted that isn't in its cache.
      Standalone like the other public/*.html error pages, and deliberately so:
      no stylesheet, no script, no font, nothing it could fail to fetch at the
      one moment it exists for. The look is .splash's, minus the animation.
    -->
    <style>

      *, *::before, *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(20px, 4vh, 44px);
        min-height: 100vh;
        min-height: 100dvh;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
                 env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        background: linear-gradient(90deg, #2f8fe0, #0c3aa0);
        color: #fff;
        font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }

      .message {
        max-width: min(90%, 760px);
        padding: clamp(10px, 2vh, 20px) clamp(20px, 4vw, 44px);
        border-radius: 14px;
        background: rgba(6, 22, 60, 0.5);
        font-weight: 600;
        font-size: clamp(18px, 3vh, 30px);
        text-shadow: 0 2px 3px rgba(0, 0, 0, 0.3);
      }

      .note {
        max-width: min(90%, 620px);
        font-size: clamp(14px, 2vh, 19px);
        opacity: 0.85;
      }

      .retry {
        padding: 0.6em 2.4em;
        border: 0;
        border-radius: 10px;
        background: linear-gradient(#f6f6f6, #d7d7d7);
        color: #2a2a2a;
        font: inherit;
        font-weight: 600;
        font-size: clamp(15px, 2.2vh, 20px);
        cursor: pointer;
      }

      .retry:hover {
        background: linear-gradient(#fff, #e6e6e6);
      }

    </style>

  </head>

  <body>

    <p class="message">No connection.</p>

    <p class="note">
      The channel needs the network for a screen it hasn't shown you before.
      Forecasts you've already seen are still here.
    </p>

    <button type="button" class="retry" onclick="location.reload()">Try again</button>

  </body>

</html>
